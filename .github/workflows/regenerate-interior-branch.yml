name: Regenerate interior branch model

on:
  push:
    branches:
      - interior-two-layer-model

permissions:
  contents: write

concurrency:
  group: interior-two-layer-model
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: interior-two-layer-model

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install geometry dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy shapely trimesh mapbox-earcut

      - name: Regenerate model assets
        run: python generuj_geometrie.py

      - name: Commit regenerated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dom_wnetrze.glb dom_bryla.glb dom_model.obj dom_materialy.mtl scena_modelu.json index.html podglad_3d.html
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Regenerate interior model assets [skip ci]"
            git push
          fi
